<html>
    <head>
        <meta charset="utf-8">
        <title>Storefront Components</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                font-size: 12px;
            }
            .toolbar {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                padding: 10px 12px;
                border-bottom: 1px solid #e0e0e0;
                background: #f5f5f5;
                z-index: 1000;
                box-sizing: border-box;
            }
            .toolbar button {
                padding: 6px 12px;
                background: #c8d5e0;
                color: #2c3e50;
                border: none;
                border-radius: 3px;
                cursor: pointer;
                line-height: 16px;
                font-size: 12px;
                font-weight: bold;
                font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            }
            .toolbar button:hover {
                background: #b8c5d0;
            }
            .toolbar button.active {
                background: #4A90E2;
                color: white;
            }
            .toolbar button.active:hover {
                background: #357ABD;
                color: white;
            }
            .toolbar {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #search-input {
                flex: 1;
                padding: 4px 8px;
                border: 1px solid #ccc;
                border-radius: 3px;
                font-size: 12px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            }
            #search-input:focus {
                outline: none;
                border-color: #4A90E2;
            }
            #component-tree {
                position: fixed;
                top: 49px;
                left: 0;
                right: 0;
                bottom: 0;
                padding: 12px;
                overflow-y: auto;
            }
            .tree {
                font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            }
            .component-name {
                font-weight: 500;
            }
        </style>
        <script src="scripts/script-loader.js"></script>
        <script src="components-panel.js"></script>
    </head>
    <body>
        <div class="toolbar">
            <input type="text" id="search-input" placeholder="Search components..." style="flex: 1; padding: 4px 8px; margin-right: 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px;">
            <button id="inspect-btn">🔍 Inspect</button>
            <button id="refresh-btn">🔄 Refresh</button>
        </div>
        <div id="component-tree"></div>
    </body>
</html>
